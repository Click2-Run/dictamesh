# DictaMesh Code Compliance GitHub Action
#
# Installation:
#   cp docs/courthouse/examples/github-action.yml .github/workflows/compliance.yml
#
# This workflow runs compliance checks on pull requests.

name: Code Compliance Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.go'
      - '**.js'
      - '**.ts'
      - '**.py'
      - '**.java'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  compliance-check:
    name: Code Compliance Judge
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **/*.go
            **/*.js
            **/*.ts
            **/*.py
            **/*.java
          files_ignore: |
            **/*_test.go
            **/*_test.js
            **/*.test.ts
            **/*_test.py
            **/*.pb.go
            **/*_generated.go
      
      - name: Check file sizes
        id: file-check
        run: |
          MAX_LINES=500
          PREFERRED_LINES=350
          VIOLATIONS=0
          WARNINGS=0
          REPORT="## 🏛️ Code Compliance Report\n\n"
          
          # Function to count code lines
          count_lines() {
            local file=$1
            # Simple line count excluding blanks and comments
            grep -v '^[[:space:]]*$' "$file" | \
            grep -v '^[[:space:]]*//' | \
            grep -v '^[[:space:]]*#' | \
            wc -l
          }
          
          if [ -z "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            REPORT+="✅ No code files to review\n"
          else
            REPORT+="### Files Reviewed\n\n"
            
            for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if [ -f "$file" ]; then
                LINES=$(count_lines "$file")
                
                if [ "$LINES" -gt "$MAX_LINES" ]; then
                  REPORT+="❌ **VIOLATION**: \`$file\` - $LINES lines (limit: $MAX_LINES)\n"
                  VIOLATIONS=$((VIOLATIONS + 1))
                elif [ "$LINES" -gt "$PREFERRED_LINES" ]; then
                  REPORT+="⚠️ **WARNING**: \`$file\` - $LINES lines (preferred: $PREFERRED_LINES)\n"
                  WARNINGS=$((WARNINGS + 1))
                else
                  REPORT+="✅ \`$file\` - $LINES lines\n"
                fi
              fi
            done
          fi
          
          REPORT+="\n### Summary\n\n"
          REPORT+="- **Violations**: $VIOLATIONS\n"
          REPORT+="- **Warnings**: $WARNINGS\n\n"
          
          if [ "$VIOLATIONS" -gt 0 ]; then
            REPORT+="### ❌ Action Required\n\n"
            REPORT+="Files exceed the 500-line hard limit. Please:\n\n"
            REPORT+="1. Split large files using patterns in \`docs/courthouse/guides/\`\n"
            REPORT+="2. Or request exception via \`docs/courthouse/templates/exception-request.yml\`\n\n"
            REPORT+="See [AGENT.md](../../AGENT.md) for policy details.\n"
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "$WARNINGS" -gt 0 ]; then
            REPORT+="### ⚠️ Recommendations\n\n"
            REPORT+="Files are approaching size limits. Consider refactoring soon.\n"
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            REPORT+="### ✅ All Checks Passed\n\n"
            REPORT+="All files comply with size limits.\n"
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
          # Save report
          echo "$REPORT" > compliance-report.md
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
      
      - name: Post compliance report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('compliance-report.md', 'utf8');
            
            // Find existing compliance comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🏛️ Code Compliance Report')
            );
            
            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
      
      - name: Set check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.file-check.outputs.status }}';
            const violations = ${{ steps.file-check.outputs.violations }};
            
            let conclusion, title, summary;
            
            if (violations > 0) {
              conclusion = 'failure';
              title = '❌ Compliance check failed';
              summary = `${violations} file(s) exceed size limits`;
            } else if (status === 'warning') {
              conclusion = 'neutral';
              title = '⚠️ Compliance warnings';
              summary = 'Some files approaching size limits';
            } else {
              conclusion = 'success';
              title = '✅ Compliance check passed';
              summary = 'All files comply with size policies';
            }
            
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Code Compliance',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: summary
              }
            });
      
      - name: Fail if violations
        if: steps.file-check.outputs.violations > 0
        run: |
          echo "::error::Code compliance violations detected"
          exit 1
